name: Build VocalForge ONE v1.2 Windows

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'vocalforge_payload_v12/**'
      - 'vocalforge-v12-trigger.txt'
  workflow_dispatch:

jobs:
  build-vocalforge-v12:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source payload
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path vocalforge_payload_v12 -Filter "part_*" | Sort-Object Name
          if (-not $parts) { throw "VocalForge v1.2 payload parts not found" }
          $payload = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes('vocalforge-v12-src.tgz', [Convert]::FromBase64String($payload.Trim()))
          New-Item -ItemType Directory -Force -Path vocalforge_v12 | Out-Null
          tar -xzf vocalforge-v12-src.tgz -C vocalforge_v12

      - name: Configure
        shell: pwsh
        run: cmake -S vocalforge_v12 -B vocalforge_v12/build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        shell: pwsh
        run: cmake --build vocalforge_v12/build --config Release --target VocalForgeOne_VST3 VocalForgeOne_Standalone --parallel 2

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vocalforge_v12/dist | Out-Null
          $vst = Get-ChildItem -Path vocalforge_v12/build -Recurse -Filter "VocalForge ONE.vst3" | Select-Object -First 1
          if (-not $vst) { throw "VST3 bundle not found" }
          Copy-Item -Recurse -Force $vst.FullName vocalforge_v12/dist/
          $exe = Get-ChildItem -Path vocalforge_v12/build -Recurse -Filter "VocalForge ONE.exe" | Select-Object -First 1
          if (-not $exe) { throw "Standalone EXE not found" }
          Copy-Item -Force $exe.FullName "vocalforge_v12/dist/VocalForge ONE.exe"
          Copy-Item -Force vocalforge_v12/README.md vocalforge_v12/dist/README.txt

      - name: Upload VocalForge v1.2
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-ONE-v1.2-Windows-x64
          path: vocalforge_v12/dist
          if-no-files-found: error
          compression-level: 9
