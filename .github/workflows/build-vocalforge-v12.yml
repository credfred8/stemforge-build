name: Build VocalForge ONE v2 Windows

on:
  push:
    branches: [ main ]
    paths:
      - 'vocalforge_v2/**'
      - '.github/workflows/build-vocalforge-v12.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'vocalforge_v2/**'
      - 'vocalforge-v20-trigger.txt'
      - '.github/workflows/build-vocalforge-v12.yml'
  workflow_dispatch:

jobs:
  build-vocalforge-v20:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S vocalforge_v2 -B vocalforge_v2/build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 and Standalone
        shell: pwsh
        run: cmake --build vocalforge_v2/build --config Release --target VocalForgeOne_VST3 VocalForgeOne_Standalone --parallel 2

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vocalforge_v2/dist | Out-Null
          $vst = Get-ChildItem -Path vocalforge_v2/build -Recurse -Directory -Filter "VocalForge ONE.vst3" | Select-Object -First 1
          if (-not $vst) { throw "VST3 bundle not found" }
          Copy-Item -Recurse -Force $vst.FullName vocalforge_v2/dist/
          $exe = Get-ChildItem -Path vocalforge_v2/build -Recurse -File -Filter "VocalForge ONE.exe" | Select-Object -First 1
          if (-not $exe) { throw "Standalone EXE not found" }
          Copy-Item -Force $exe.FullName "vocalforge_v2/dist/VocalForge ONE.exe"
          @"
          VocalForge ONE v2.0 PRO
          Windows x64 / VST3 + Standalone

          VST3: copy the VocalForge ONE.vst3 bundle to your VST3 folder and rescan in the DAW.
          Standalone: open VocalForge ONE.exe, load WAV/MP3, choose a preset, and audition the same vocal engine.
          "@ | Set-Content -Encoding UTF8 vocalforge_v2/dist/README.txt

      - name: Hash binaries
        shell: pwsh
        run: |
          Get-FileHash "vocalforge_v2/dist/VocalForge ONE.exe" -Algorithm SHA256 | Format-List | Out-File vocalforge_v2/dist/SHA256.txt
          $bin = Get-ChildItem "vocalforge_v2/dist/VocalForge ONE.vst3" -Recurse -File | Select-Object -First 1
          if ($bin) { Get-FileHash $bin.FullName -Algorithm SHA256 | Format-List | Out-File -Append vocalforge_v2/dist/SHA256.txt }

      - name: Upload VocalForge v2
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-ONE-v2.0-PRO-Windows-x64
          path: vocalforge_v2/dist
          if-no-files-found: error
          compression-level: 9
