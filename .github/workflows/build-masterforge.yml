name: Build MasterForge ONE v2.3 PRO Premium

on:
  push:
    branches: [ masterforge-one ]
    paths:
      - 'masterforge_one/**'
      - '.github/workflows/build-masterforge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'masterforge_one/**'
      - '.github/workflows/build-masterforge.yml'
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3537.50 -OutputDirectory masterforge_one/deps -NonInteractive

      - name: Validate Web UI JavaScript
        shell: pwsh
        run: node --check masterforge_one/WebUI/app.js

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S masterforge_one -B masterforge_one/build -G "Visual Studio 18 2026" -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$pwd/masterforge_one/deps"

      - name: Build smoke test
        shell: pwsh
        run: cmake --build masterforge_one/build --config Release --target MasterForgeSmoke --parallel 2

      - name: Run DSP smoke test
        shell: pwsh
        run: |
          $smoke = Get-ChildItem -Path masterforge_one/build -Recurse -Filter "MasterForgeSmoke.exe" | Select-Object -First 1
          if (-not $smoke) { throw "MasterForgeSmoke.exe not found" }
          & $smoke.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3
        shell: pwsh
        run: cmake --build masterforge_one/build --config Release --target MasterForgeOne_VST3 --parallel 2

      - name: Build standalone
        shell: pwsh
        run: cmake --build masterforge_one/build --config Release --target MasterForgeOne_Standalone --parallel 2

      - name: Stage and verify Windows x64 package
        shell: pwsh
        run: |
          $dist = "masterforge_one/dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $vst3 = Get-ChildItem -Path masterforge_one/build -Recurse -Directory -Filter "MasterForge ONE.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "MasterForge ONE.vst3 bundle not found" }
          Copy-Item -Recurse -Force $vst3.FullName "$dist/MasterForge ONE.vst3"

          $exe = Get-ChildItem -Path masterforge_one/build -Recurse -File -Filter "MasterForge ONE.exe" | Select-Object -First 1
          if (-not $exe) { throw "MasterForge ONE.exe not found" }
          Copy-Item -Force $exe.FullName "$dist/MasterForge ONE.exe"

          Copy-Item -Force "masterforge_one/README.md" "$dist/README.md"

          $vst3Binary = Get-ChildItem -Path "$dist/MasterForge ONE.vst3" -Recurse -File |
            Where-Object { $_.Name -eq "MasterForge ONE.vst3" } |
            Select-Object -First 1

          if (-not $vst3Binary) { throw "VST3 x64 binary inside bundle not found" }
          if ($vst3Binary.Length -lt 100000) { throw "VST3 binary is unexpectedly small" }

          $standalone = Get-Item "$dist/MasterForge ONE.exe"
          if ($standalone.Length -lt 100000) { throw "Standalone EXE is unexpectedly small" }

          Write-Host "Verified VST3 binary: $($vst3Binary.FullName) $($vst3Binary.Length) bytes"
          Write-Host "Verified standalone: $($standalone.FullName) $($standalone.Length) bytes"

      - name: Upload MasterForge ONE v2.3 PRO Premium
        uses: actions/upload-artifact@v4
        with:
          name: MasterForge-ONE-v2.3-PRO-Premium-Windows-x64
          path: masterforge_one/dist
          if-no-files-found: error
          compression-level: 9
