name: Build VocalForge ONE VST3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-vocalforge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build-vocalforge.yml'
      - 'vocalforge-trigger.txt'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore VocalForge source
        shell: pwsh
        run: |
          $payload = @'
[... ELLIPSIZATION ...]
'@
          [IO.File]::WriteAllBytes('vocalforge-src.tgz', [Convert]::FromBase64String($payload.Trim()))
          New-Item -ItemType Directory -Force -Path vocalforge | Out-Null
          tar -xzf vocalforge-src.tgz -C vocalforge

      - name: Configure
        shell: pwsh
        run: cmake -S vocalforge -B vocalforge/build -G "Visual Studio 17 2022" -A x64

      - name: Build Release VST3 and Standalone
        shell: pwsh
        run: cmake --build vocalforge/build --config Release --target VocalForgeOne_VST3 VocalForgeOne_Standalone --parallel 2

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vocalforge/dist | Out-Null
          $vst = Get-ChildItem -Path vocalforge/build -Recurse -Filter "VocalForge ONE.vst3" | Select-Object -First 1
          if (-not $vst) { throw "VST3 bundle not found" }
          Copy-Item -Recurse -Force $vst.FullName vocalforge/dist/
          $exe = Get-ChildItem -Path vocalforge/build -Recurse -Filter "VocalForge ONE.exe" | Select-Object -First 1
          if ($exe) { Copy-Item -Force $exe.FullName vocalforge/dist/ }
          Copy-Item -Force vocalforge/README.md vocalforge/dist/SOURCE-NOTES.txt
          @"
          VocalForge ONE v1.0.0 - Windows x64

          INSTALL:
          1. Close FL Studio.
          2. Copy the entire "VocalForge ONE.vst3" folder to:
             C:\Program Files\Common Files\VST3\
          3. Open FL Studio -> Options -> Manage plugins -> Find installed plugins.

          The .exe is an optional standalone test build.
          "@ | Set-Content -Path vocalforge/dist/INSTALL.txt

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-ONE-Windows-x64
          path: vocalforge/dist
          if-no-files-found: error
          compression-level: 9
