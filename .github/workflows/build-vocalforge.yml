name: Build VocalForge ONE Standalone EXE

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'vocalforge_payload/**'
      - '.github/workflows/build-vocalforge.yml'
  push:
    branches: [ main ]
    paths:
      - 'vocalforge_payload/**'
      - '.github/workflows/build-vocalforge.yml'
  workflow_dispatch:

jobs:
  build-windows-standalone:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore VocalForge v1.1 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path vocalforge_payload -Filter "part_*" | Sort-Object Name
          if (-not $parts) { throw "VocalForge payload parts not found" }
          $payload = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes('vocalforge-src.tgz', [Convert]::FromBase64String($payload.Trim()))
          New-Item -ItemType Directory -Force -Path vocalforge | Out-Null
          tar -xzf vocalforge-src.tgz -C vocalforge

      - name: Configure Windows x64
        shell: pwsh
        run: cmake -S vocalforge -B vocalforge/build -G "Visual Studio 17 2022" -A x64

      - name: Build VocalForge ONE Standalone
        shell: pwsh
        run: cmake --build vocalforge/build --config Release --target VocalForgeOne_Standalone --parallel 2

      - name: Stage EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vocalforge/dist | Out-Null
          $exe = Get-ChildItem -Path vocalforge/build -Recurse -Filter "VocalForge ONE.exe" | Select-Object -First 1
          if (-not $exe) { throw "VocalForge ONE.exe not found" }
          Copy-Item -Force $exe.FullName "vocalforge/dist/VocalForge ONE.exe"
          @"
          VocalForge ONE v1.1 PRO - Standalone Windows x64

          No DAW is required.
          Run VocalForge ONE.exe, open Audio/MIDI Settings if needed,
          choose your microphone/audio interface input and your output device.

          Factory preset calibration:
          RMS around -18 dBFS, vocal peaks around -12 to -8 dBFS.
          "@ | Set-Content -Path vocalforge/dist/README.txt

      - name: Upload Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-ONE-v1.1-PRO-Standalone-Windows-x64
          path: vocalforge/dist
          if-no-files-found: error
          compression-level: 9
